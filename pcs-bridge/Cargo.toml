[package]
name = "pcs-bridge"
version = "0.1.0"
edition = "2021"
description = "Cross-field PCS bridge: derive WHIR inputs that produce the same Merkle commitment as Binius"

[dependencies]
anyhow = "1.0"

# Binius (for NTT and commitment)
binius_core = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }
binius_field = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }
binius_ntt = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }
binius_hash = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }
binius_math = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }
binius_utils = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b", default-features = false }
binius_m3 = { git = "https://github.com/themighty1/binius", rev = "268ed24d578933e782fcecd2409e190c52adb36b" }

# Plonky3 / Goldilocks (for WHIR side)
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0fa5139" }

blake3 = "1"
digest = "0.10"

# Pin zerocopy for nightly compat
zerocopy = "=0.8.26"
