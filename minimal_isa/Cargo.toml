[package]
name = "json-wasm-bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_native"
path = "src/bin/test_native.rs"

[[bin]]
name = "minimal_assertion"
path = "src/bin/minimal_assertion.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
