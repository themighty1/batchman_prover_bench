[package]
name = "batchman_witness_generator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
reg-analyzer = { path = "../minimal_isa/reg-analyzer" }

[[bin]]
name = "batchman_witness_generator"
path = "src/main.rs"

[[bin]]
name = "segment_keys"
path = "src/segment_keys.rs"
