[package]
name = "pcs-mode"
version = "0.1.0"
edition = "2021"
description = "PCS mode for the Batchman protocol: replaces LPZK with polynomial commitment-based subset proof"

[features]
default = ["parallel"]
baby-bear = ["p3-baby-bear"]
koala-bear = ["p3-koala-bear"]
parallel = [
    "p3-dft/parallel",
    "p3-blake3/parallel",
    "p3-util/parallel",
    "binius_core/rayon",
    "binius_field/rayon",
    "binius_ntt/rayon",
    "binius_hash/rayon",
    "binius_hal/rayon",
    "binius_math/rayon",
    "binius_utils/rayon",
    "binius_m3/rayon",
    "binius_fast_compute/rayon",
]

[dependencies]
p3-field = "0.4"
p3-goldilocks = "0.4"
p3-baby-bear = { version = "0.4", optional = true }
p3-koala-bear = { version = "0.4", optional = true }
p3-fri = "0.4"
p3-commit = "0.4"
p3-merkle-tree = "0.4"
p3-symmetric = "0.4"
p3-challenger = "0.4"
p3-matrix = "0.4"
p3-dft = "0.4"
p3-util = "0.4"
p3-poseidon2 = "0.4"
p3-blake3 = "0.4"
rand = "0.9"
itertools = "0.14"
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1.0"

# Binius dependencies (vendored patched copy with standalone commitments)
binius_core = { path = "deps/binius/crates/core" }
binius_field = { path = "deps/binius/crates/field" }
binius_ntt = { path = "deps/binius/crates/ntt" }
binius_hash = { path = "deps/binius/crates/hash" }
binius_hal = { path = "deps/binius/crates/hal" }
binius_math = { path = "deps/binius/crates/math" }
binius_compute = { path = "deps/binius/crates/compute" }
binius_utils = { path = "deps/binius/crates/utils", default-features = false }
binius_maybe_rayon = { path = "deps/binius/crates/maybe_rayon" }
binius_m3 = { path = "deps/binius/crates/m3" }
binius_fast_compute = { path = "deps/binius/crates/fast_compute" }
bytemuck = "1"
blake3 = "1"
digest = "0.10"

[[bin]]
name = "plonky-pcs"
path = "src/plonky_pcs.rs"

[[bin]]
name = "binius-pcs"
path = "src/binius_pcs.rs"

[[bin]]
name = "step-records-proof"
path = "src/step_records_proof.rs"
